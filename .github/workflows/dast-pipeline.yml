name: DAST Automated Pentest (OWASP ZAP)

on:
  push:
    branches: [ "main" ]

jobs:
  zap-baseline-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar o OWASP Juice Shop (O Alvo)
        # Inicia a app vulneravel em background (-d) na porta 3000
        run: docker run --rm -d -p 3000:3000 bkimminich/juice-shop

      - name: Aguardar que a aplicacao inicie
        # Dá tempo para o servidor Node.js arrancar completamente
        run: sleep 15

      - name: Disparar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          # Definido como false inicialmente para poder ler o relatorio completo sem o job falhar imediatamente
          fail_action: false
          cmd_options: '-a'
